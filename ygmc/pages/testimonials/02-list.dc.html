<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Testimonials List</title>
<script src="../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;1,400&amp;display=swap">
<style>
body{margin:0;background:#fcfcfc}
</style>
</helmet>
<section style="width: 100%; box-sizing: border-box; padding: 55px 115px 120px; background: #fcfcfc; font-family: Roboto, sans-serif; color: #2a2828; letter-spacing: -0.35px; display: grid; grid-template-columns: 341fr 391fr 341fr; column-gap: 65px; align-items: start">
<sc-for list="{{cols}}" as="col" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 40px">
<sc-for list="{{col.items}}" as="item" hint-placeholder-count="6">
<sc-if value="{{item.img}}" hint-placeholder-val="{{ false }}">
<img src="{{item.img}}" alt="{{item.alt}}" style="width: 100%; height: {{item.h}}; object-fit: cover; display: block">
</sc-if>
<sc-if value="{{item.q}}" hint-placeholder-val="{{ true }}">
<figure style="margin: 0">
<blockquote style="margin: 0; font-size: 17.7px; line-height: 1.3">{{item.q}}</blockquote>
<figcaption style="margin-top: 22px; font-size: 17.7px; font-style: italic">{{item.who}}</figcaption>
</figure>
</sc-if>
</sc-for>
</div>
</sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4194}}'>
class Component extends DCLogic {
  renderVals() {
    const T = (q, who) => ({ q, who });
    const I = (img, h, alt) => ({ img, h, alt });
    return { cols: [
      { items: [
        T('“I was able to encounter God through YGMC after I repented of all my sins to him and my parents. I have been struggling with addiction for so long yet I was never able to quit on my own. My addiction was distancing me from my family and everyone else I loved. Through YGMC I saw my generation and people really giving it their all for God, which really opened my eyes. Right after the trip, I told my parents about all my struggles and addictions as I have been lying to them for too long now. I was able to receive the grace of God only after I repented and really open up my heart to him. Addiction is strong but I know with him by my side, I can overcome any obstacle in my path.”', 'Indiana/High School'),
        T('“God restored my love for worship and prayer and showed me the importance of both of them through the camp and the days following. He also worked with me on my want of approval of others. It is something that I am still struggling with but I am getting better. And he showed me the heart of the InterCP body! Really amazing!!”', 'Atlanta/High School'),
        T('God showed his grace upon me and my team and family, I can say I no longer live as an immigrant for the American dream, but for God, I’m so happy I am saved.', 'New Jersey/Campus'),
        I('../../assets/images/b71bef517c47c2df65de06bf18c2b691.webp', '1060px', 'A young man receiving prayer at YGMC'),
        T('“The conference was a blessing in my life. Living in the United States has been a challenge starting because no one is Christian in my family and it has been difficult to live focused on Jesus, especially when we see so many young people living a life without purpose and little by little, I felt like I was becoming one of those youths. Seeing the testimonies of young people living to bring the gospel to places where the Lord is not heard brought into my life that fire that was going out more and more every day. He made me resume my commitment to the Lord to go and share when he sends me. In the meantime, I will share and serve by sharing the vision of him where I live.”', 'Florida/Young Adult'),
        T('“I pray throughout YGMC for God to really open my eyes and he did. Ever since YGMC, God has convicted me to not live for myself, but for him. Every day, I am getting closer to him. YGMC made me closer to God. I want to carry my cross and live for him now. I\'m careful to not follow the world trend, but His.”', 'Indiana/Campus'),
        T('“God has revealed to me how shallow my personal relationship I had with him was. I was a prostitute using and manipulating God for grace rather than fully surrendering myself to worship and praise him for the God he is. I would stop worshipping, reading word, and praying if there was no grace. Yet I was still so active in serving youth prayer ministry and Pakistan Nation Network core team. I realized how ministry has become my idol and how I relied on it to have a relationship with God. I did not serve out of overflowing love but I served to continue to love God. I want to restore my first love with God and want to be rooted in word, worship and prayer and develop an intimate and personal relationship with God who is like a friend and a father.”', 'New Jersey/High School'),
        T('This year camp has encouraged me to be on fire for the Lord. I saw how passionate you guys were about Jesus and it really inspired me. I wrote down before the lecture or worship. I was receiving a heart for Egypt I wasn’t sure why. But I went to the expo and I felt the Holy Spirit there and I went away to have alone time and I read and I prayed to God and asked Him if it’s really Egypt, I really want to hear a testimony about it. And a few minutes after, there was a testimony of Egypt for Student Missions. So, praise God. I pray that I really do his will. And I pray that I would receive a heart for the nations, and I pray that when it’s his timing that I will be obedient and go out.', 'New Jersey/Campus')
      ]},
      { items: [
        I('../../assets/images/f2cbd913589087977653aa8e6b6df650.webp', '455px', 'A group of smiling students pointing up'),
        T('“This past fall unfortunately something happened to me that did change my life. This problem is not something that you can fix. At this time, I was a Christian, but my heart became so broken. I ended up sliding back and had done some old habits. (I had stopped since then). Eventually, I had tried to heal but my heart was still hurting for 1 year and I had really not told any of the people the people that know me. I had prayed to God to help me overcome but it just hard to overcome. To make a long story short I received counseling, and I was prayed over. I actually got delivered. In my life when bad things happen, I get spiritual warfare, and I end up not speaking about it. In James 5:16, it says: Therefore, confess your sins to one another and pray for one another, that you may be healed. The prayer of a righteous person has great power as it is working. Through spiritual warfare, I was not able to speak about it, it was like I was fighting eternally. But not matter what demon or burden I had I know for a fact that Jesus is my savior. That he came to set us free. Now the demon no longer has my voice, and I can speak about whatever I want to speak about. Jesus healed me and used these women to help me. I made a commitment to go to Pakistan the summer of 2024. (I wanted to go before YGMC). I believe that I was oppressed by a demon and these women said that a demon attached itself to my trauma. I wish I could tell you everything that happened, but this is the biggest part of YGMC for me. I got healed and people laid their hands on me and really prayed with me. Yes, the past can hurt, and this person did hurt me, but I am alive in Christ. As mentioned, before he came to set us free.”', 'Pennsylvania/Young Adult'),
        T('“This YGMC had a lot of expectations because I went to AGMC (All Generation Mission Camp). And I’ve witnessed what God has been doing in the nations! This YGMC 2023 was great! Praise the Lord. I’m just thankful the God made it possible for us to gather all together and come before him in worship and praise! I’m thankful to have seen many of my friends and people I have not seen in a while. I’m thankful that God is still sending out workers in all nations in these end times!!”', 'California/Campus'),
        T('I really experience what it means to be with the Body of Christ 🙏. I experienced Revelation 7:9-10, I imagined how much more beautiful will it be in that day in heaven. Every tribe, tongue, and language worship together with our Lord. The room was filled with the presence of the Holy Spirit. How us as young people generation, to give up ourselves and lives for the Gospel of the Kingdom of God. God completely restored me, and I looked around and remembered how the early churches gave their own lives up for Jesus Christ. The voice in my head was like, "Jesus I don\'t want to deny you, I don\'t want to be like today\'s Christians, just because it\'s my identity, but Lord, I want to live for you alone, please help me ". For to me, to live is Christ and to die is gain. Philippians 1:21 Amen Lord Jesus 🙏 🙌.', 'New Jersey/Campus'),
        I('../../assets/images/57baa7bd17a7c2a5d92c51a9eb86b105.webp', '398px', 'Four young women smiling together at YGMC'),
        T('“God has spoken to me that as His children, we cannot go after our own dreams and desires but go after God’s vision and what He desires for us. I used to have this mindset of prioritizing my education and soon living a rich successful life so I can make a better living for myself and family. However, I learned that we cannot idolize money nor other desires as the world does. When we do, we will never be satisfied, and we will lack the love and peace of God. To add on, I also truly received that God’s heart breaks for these unreached nations because every day, people are dying without knowing the Gospel. With this grace, God has broken my heart as well. Moving on, I was encouraged to worship God with my all and with all that I am. Sometimes I would be afraid to dance or put my hands up during worship because I was worried about others watching me or judging me but through YGMC worship, I was challenged to give up my fears of this. Lastly, God has genuinely touched and broken my heart for the nation of Pakistan. When a sister was reading a prayer in Urdu, I just started weeping and I know the Holy Spirit was working. I committed to God that I will for sure go and that if He calls me to go again for however long, I will go.”', 'Denver/Campus'),
        T('God has spoken to me throughout YGMC by telling me that I was meant to be a child of God and that he forgives me for my sins I’ve made. The grace I would like to share is that God has been so good to each one of us and has never left us. I have been encouraged and challenged throughout the camp by having a heart for each nation and to be committed to having a relationship with Jesus Christ.', 'California/Young Adult')
      ]},
      { items: [
        T('“YGMC prepared my heart which was already open for the nations, even more than I could have ever imagined! The Lord convicted me of really committing to the mission He has for me in these final days and I got the opportunity to ask for grace to be able accomplish His mission. After the end of YGMC I was able to talk to my branch leaders and God helped me come up with a plan to go to the nations this winter. I was able to experience the joy of the Lord through the amazing worship songs, small groups and teaching sessions at YGMC. YGMC was an encounter with the Lord, His vision and His people that I hold so dear to my heart. I thank God that He gave me the privilege to experience it and be part of this great work!”', 'Denver/Young Adult'),
        T('“YGMC taught me that I don\'t need to be shy about my love for God, that if I set my pride apart from myself, I can worship God wholeheartedly. God convicted me of my addiction to the world, YGMC taught me that I don\'t need my phone, my videogames, or money to really have a good time praising God. The grace I received is heart for Israel and Palestine. When I worship and pray, I want to worship and pray on behalf of them. I\'m free to do this in America, but they aren\'t free to worship or pray freely in the nations.”', 'Seattle/Campus'),
        T('I received grace in the form of knowing that I was made to go and serve those who have never known Jesus. And received healing in one of the lectures. One of the hardships I faced was to know that I had been thinking of myself all this time, and really never asked myself what God wanted. It was harsh but the truth and needed in my life.', 'Utah/High School'),
        I('../../assets/images/687bce88ffe42952a6dd25a3a528bd71.webp', '945px', 'A young man praying with open hands during worship'),
        T('The same week of YGMC, before we went, God showed me why I always rejected missions, and I did not realize that growing up I’ve always rejected missions because I struggled with being different. I always thought missions was different because it’s not something you hear about everyday therefore, I wanted nothing to do with it. But family members and other people growing up has always told me that they see me on the mission field, and deep down I knew God was going to put me in missions I just didn’t know how or when and I didn\'t want to accept it either. Now since I’m older and trying to grow in my relationship with the Lord I just want the Lord’s will be done at the end of the day and I have grown out of trying to fit in and accepted that I am different. So, the Lord gave me this realization and it made sense. I was in awe and it was perfect timing right before YGMC. I was able to accept and have an open mind about missions for the first time. During YGMC, it was awesome! Worship was AWESOME!! It was encouraging to see so many other young adults on fire for the Lords will. It was also interesting to learn about these type of missions in the unreached nations. Another grace though that the Lord gave me during YGMC was that one of the speakers said to stop waiting on God for the heart or passion to go and just be obedient to Gods will. That really stuck out and I was touched because that was another main thing that I compared myself to my mom who has a PASSION for missions and her heart is just so on fire for that and I know I don’t have it like that or at all even. When he said that, I was just touched, and I knew the Lord was working something within me too. At the end I did commit to taking Vision School and goin on Field Operation (Mission Trip) in the summer of 2024. Mind you when my mom first mentioned Vision School and YGMC to me, I automatically rejected it and to be here now like wanting to at least try because I know that as a Christian this is my purpose, is completely amazing. It’s all quite funny to me because throughout the years I specifically prayed asking God to not put me in missions because I knew He was gonna do it lol!! But God’s will be done, not mine!!', 'New Jersey/Campus'),
        T('God spoke to me through the different people that told their testimonies in the nations. Through meeting so many awesome like-minded individuals, I was encouraged to sign up for Field Operation this winter. It was all a beautiful time spent with great people and, of course, God.', 'Stockton/Campus'),
        T('I received grace to really lay down my life for the Gospel and truly make Jesus Lord of my life. God continuously reminded me that I am not weak, I am loved, and I should not condemn myself. During the last day when they called for Student Mission and Field Operation (Mission Trip) commitments I couldn\'t stop crying and someone prayed that I will be a mother to the nations, and it really touch me that the Lord will choose me. As well as I received grace to be intentional on my career and possible do KSI (Kingdom School International).', 'New Jersey/Campus')
      ]}
    ]};
  }
}
</script>
</body>
</html>
