<h2 style="margin: 0; font-size: 68px; font-weight: 400; letter-spacing: -1.36px">Testimonials</h2>
<div style="margin-top: 92px; padding: 0 110px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 65px; align-items: start">
<figure style="margin: 0"><figcaption style="font-size: 22.9px; letter-spacing: -0.35px">New Jersey/Campus</figcaption><blockquote style="margin: 32px 0 0; font-family: 'Roboto Mono', monospace; font-size: 12.5px; line-height: 23px">At YGMC, I received the grace to lay down my life for the gospel and truly make Jesus the Lord of my life. God continuously reminded me that I am not weak but loved, and I should not condemn myself. During the last day, when they asked about 1-year Student Missions commitment, I couldn't stop crying. Someone prayed that I would be a mother to the nations and it touched me that God would choose someone like me.</blockquote></figure>
<figure style="margin: 0"><figcaption style="font-size: 22.9px; letter-spacing: -0.35px">Indiana/High School</figcaption><blockquote style="margin: 32px 0 0; font-family: 'Roboto Mono', monospace; font-size: 12.5px; line-height: 23px">I encountered God through YGMC after I repented of all my sins to Him and my parents. I had been struggling with addiction for a long time, yet I was never able to quit on my own. My addiction distanced me from my family and everyone I loved. But through YGMC, I saw my generation really giving their all for God and it opened my eyes. Right after YGMC ended, I told my parents about my struggle with addiction as I have been lying to them for too long. I received the grace of God only after I repented and opened my heart to Him.</blockquote></figure>
<figure style="margin: 0"><figcaption style="font-size: 22.9px; letter-spacing: -0.35px">Denver/Young Adult</figcaption><blockquote style="margin: 32px 0 0; font-family: 'Roboto Mono', monospace; font-size: 12.5px; line-height: 23px">YGMC prepared my heart for the nations even more than I could have ever imagined! The Lord convicted me to commit to the mission in these final days, and I received the opportunity to accomplish His mission. I experienced the joy of the Lord through amazing worship, small group, and teaching sessions at YGMC. YGMC was an encounter with the Lord, His vision and people, and I hold it so dear to my heart. I thank God that He gave me the privilege to experience it and be a part of this great work!</blockquote></figure>
</div>
