<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact Us</title>
<script src="../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#000}
</style>
</helmet>
<section style="width: 100%; min-height: 667px; box-sizing: border-box; padding: 78px 58px 95px; background: #000; color: #fcfcfc; font-family: Roboto, sans-serif; letter-spacing: -0.35px; display: grid; grid-template-columns: 715px 428px; align-items: start">
<div style="display: flex; flex-direction: column; min-height: 430px">
<h1 style="margin: 0; font-size: 28px; font-weight: 400; letter-spacing: -0.56px; color: #adadad">Contact Us</h1>
<div style="margin-top: auto; max-width: 470px; display: flex; flex-direction: column; gap: 16px; font-size: 17.7px; font-weight: 700; line-height: 1.3">
<p style="margin: 0">We'd love to hear from you. Whether you're interested in learning about our ministries, participating in mission trip opportunities or requesting a speaker for your church -- we're happy to help!</p>
<p style="margin: 0">Please fill out the form and we will get back to you as soon as possible.</p>
</div>
</div>
<form style="display: flex; flex-direction: column; gap: 16px">
<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0; font-size: 17.7px">Name</legend>
<div style="margin-top: 6px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px">
<span>First Name <span style="margin-left: 4px; color: #b5b5b5">(required)</span></span>
<input type="text" required style="height: 43px; box-sizing: border-box; border: 1px solid #c6c6c6; background: #fafafa; font-size: 16px; padding: 0 12px">
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px">
<span>Last Name <span style="margin-left: 4px; color: #b5b5b5">(required)</span></span>
<input type="text" required style="height: 43px; box-sizing: border-box; border: 1px solid #c6c6c6; background: #fafafa; font-size: 16px; padding: 0 12px">
</label>
</div>
</fieldset>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 17.7px">
<span>Email <span style="margin-left: 6px; font-size: 12px; color: #b5b5b5">(required)</span></span>
<input type="email" required style="height: 43px; box-sizing: border-box; border: 1px solid #c6c6c6; background: #fafafa; font-size: 16px; padding: 0 12px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 17.7px">
<span>Subject <span style="margin-left: 6px; font-size: 12px; color: #b5b5b5">(required)</span></span>
<input type="text" required style="height: 43px; box-sizing: border-box; border: 1px solid #c6c6c6; background: #fafafa; font-size: 16px; padding: 0 12px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 17.7px">
<span>Message <span style="margin-left: 6px; font-size: 12px; color: #b5b5b5">(required)</span></span>
<textarea required style="height: 98px; box-sizing: border-box; border: 1px solid #c6c6c6; background: #fafafa; font-size: 16px; padding: 12px; font-family: Roboto, sans-serif"></textarea>
</label>
<button type="submit" style="margin-top: 4px; align-self: flex-start; height: 49px; padding: 0 21px; background: transparent; border: 1px solid #fff; border-radius: 10px; color: #fff; font-family: Roboto, sans-serif; font-size: 12.5px; font-weight: 500; letter-spacing: 0.63px; cursor: pointer">SUBMIT</button>
</form>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":769}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
